<title>Laats a déménagé</title>
<link rel="canonical" href="https://mstaal-maths.github.io/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="2; url=https://mstaal-maths.github.io/">
<script>
(function(){
  var go=function(){ location.replace("https://mstaal-maths.github.io/"+(location.hash||"")); };
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }).then(go, go);
      setTimeout(go, 1500);
    } else go();
  }catch(e){ go(); }
})();
</script>
