/* Layout : un cahier à petits carreaux, une colonne centrée, couleur propre à chaque classe, surligneur jaune pour l'essentiel */
:root{
  --paper:#f6f8fc; --grid:#e1e8f4; --surface:#ffffff; --ink:#15213b; --muted:#56627d; --line:#d3dbea;
  --hl:rgba(255,206,46,.78); --c6:#2563eb; --c5:#d6336c; --c4:#0b8457; --c3:#7c3aed; --ok:#167a54; --okbg:#e3f5ec; --ko:#c43c3c; --kobg:#fce9e9;
  --warn:#9a6700; --warnbg:#fff4d6;
  --f-display:"Bricolage Grotesque", "Arial Black", Arial, sans-serif;
  --f-body:"Lexend", Arial, Helvetica, sans-serif;
  --c:var(--c6);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1524; --grid:#172036; --surface:#141e31; --ink:#e7ecf6; --muted:#9ba7c0; --line:#263250;
  --hl:rgba(255,206,46,.30); --c6:#7aa4ff; --c5:#ff7fa8; --c4:#4fd2a0; --c3:#b89bff; --ok:#4fd29b; --okbg:#0f3326; --ko:#ff8a8a; --kobg:#3a1a1e;
  --warn:#ffcf5c; --warnbg:#3a2f10; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1524; --grid:#172036; --surface:#141e31; --ink:#e7ecf6; --muted:#9ba7c0; --line:#263250;
  --hl:rgba(255,206,46,.30); --c6:#7aa4ff; --c5:#ff7fa8; --c4:#4fd2a0; --c3:#b89bff; --ok:#4fd29b; --okbg:#0f3326; --ko:#ff8a8a; --kobg:#3a1a1e;
  --warn:#ffcf5c; --warnbg:#3a2f10; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.65;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1040px;margin:0 auto;padding-block:18px 72px}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0}
p{margin:0}
.hl{background:linear-gradient(transparent 56%,var(--hl) 56%,var(--hl) 92%,transparent 92%);padding:0 .08em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--c);outline-offset:3px;border-radius:6px}

/* fractions écrites en colonne */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .12em;font-variant-numeric:tabular-nums}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .2em}
.fr>span{padding:0 .2em}
.big .fr{font-size:1.25em}

/* barre du haut */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:40px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600}
.badge{width:38px;height:38px;flex:none;display:block}
.crumbs{font-size:15px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.crumbs a{text-decoration:none;font-weight:500;color:var(--ink)}
.crumbs a:hover{text-decoration:underline}

/* accueil */
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:600;color:var(--muted)}
.hero{display:grid;gap:18px;margin-bottom:44px}
.hero h1{font-size:clamp(2.5rem,7.5vw,4.6rem);font-weight:800;letter-spacing:-.025em;max-width:13ch}
.hero .lead{font-size:clamp(1.05rem,2.4vw,1.25rem);max-width:56ch;color:var(--muted)}
.ask{font-size:clamp(1.5rem,4vw,2rem);font-weight:800;margin-bottom:16px}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:56px}
.cls{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:22px 24px;background:var(--surface);border:2px solid var(--line);border-radius:18px;text-decoration:none;transition:border-color .15s,transform .15s}
.cls:hover{border-color:var(--c);transform:translateY(-2px)}
.cls .big{font-family:var(--f-display);font-weight:800;font-size:4rem;line-height:.9;color:var(--c);letter-spacing:-.04em}
.cls .big sup{font-size:.45em;vertical-align:.95em;margin-left:2px}
.cls strong{display:block;font-size:1.25rem;font-family:var(--f-display)}
.cls span.meta{color:var(--muted);font-size:15px}
.cls .arrow{font-size:1.6rem;color:var(--c)}
.mine{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;background:var(--hl);padding:1px 8px;border-radius:4px}
.uses h2{font-size:1.5rem;margin-bottom:18px}
.usegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px 32px}
.use{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.use .ico{width:44px;height:44px;color:var(--ink)}
.use h3{font-size:1.15rem}
.use p{color:var(--muted);font-size:16px}

/* classe */
.head{display:grid;gap:10px;margin-bottom:26px}
.head h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em}
.head h1 .num{color:var(--c)}
.head p{color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{font:inherit;font-size:15px;font-weight:500;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.chap{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--surface);border:2px solid var(--line);border-radius:14px;text-decoration:none;min-height:120px;transition:border-color .15s,transform .15s}
.chap .best{margin-top:auto}
.chap:hover{border-color:var(--c);transform:translateY(-2px)}
.chap .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px}
.chap .n{font-family:var(--f-display);font-weight:800;color:var(--c);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
/* texte agrandi : l'étiquette du nombre de niveaux passe sous le type d'activité, sur toutes les cartes */
html.fs-1 .chap.info .row, html.fs-2 .chap.info .row{flex-direction:column;align-items:flex-start;gap:6px}
.chap h3{font-size:1.15rem;font-weight:600}
.chap .dom{margin-top:auto;font-size:14px;color:var(--muted)}
.chap.soon h3{color:var(--muted)}
.st{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st.on{background:var(--okbg);color:var(--ok)}
.st.off{border:1.5px solid var(--line);color:var(--muted)}
.best{font-size:13px;font-weight:600;color:var(--ink)}

/* chapitre */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:28px}
.tab{font:inherit;font-size:16px;font-weight:500;background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;position:relative;border-radius:8px 8px 0 0}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-2px;height:5px;background:var(--c);border-radius:3px}
.panel{display:grid;gap:22px;max-width:780px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:22px 24px;min-width:0}
.savoir ul{margin:8px 0 0;padding-left:1.2em}
.savoir h3{font-size:1.15rem}
.cours h3{font-size:1.35rem;display:flex;gap:12px;align-items:baseline;margin-bottom:12px}
.cours h3 .k{font-size:1rem;color:var(--c);font-weight:800;flex:none}
.cours h4{font-family:var(--f-display);font-size:1.08rem;margin:6px 0 0}
.body{display:grid;gap:12px;min-width:0;grid-template-columns:minmax(0,1fr)}
.body ul,.body ol{margin:0;padding-left:1.3em}
.body li+li{margin-top:4px}
.retenir{position:relative;border:2px solid var(--ink);border-radius:8px;padding:20px 18px 14px;margin-top:10px}
.retenir::before{content:attr(data-l);position:absolute;top:-.8em;left:14px;background:var(--surface);padding:0 8px;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--c)}
.note{background:var(--warnbg);border-radius:10px;padding:10px 14px;font-size:15px}
.note b{color:var(--warn)}
.attention{border-left:5px solid #d0342c;background:color-mix(in srgb,#d0342c 9%,transparent);border-radius:6px;padding:10px 14px;margin:12px 0}
.attention b:first-child{color:#d0342c}
.calc{font-variant-numeric:tabular-nums;background:var(--paper);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:nowrap}
.scroll{overflow-x:auto}
table.num{border-collapse:collapse;font-variant-numeric:tabular-nums;text-align:center;min-width:560px;width:100%}
table.num th,table.num td{border:1.5px solid var(--line);padding:6px 4px}
table.num thead th{font-size:13px;font-weight:600}
table.num thead tr:first-child th:nth-child(odd){background:var(--paper)}
table.num td{font-family:var(--f-display);font-weight:800;font-size:1.3rem;height:46px}
table.std{border-collapse:collapse;width:100%;font-size:15px}
table.std th,table.std td{border:1.5px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
table.std th{background:var(--paper);font-weight:600}
figure{margin:0;display:grid;gap:6px;justify-items:start}
figcaption{font-size:14px;color:var(--muted)}
.figimg{display:block;max-width:100%;height:auto;background:#fff;border-radius:8px;padding:6px}
.figs{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
svg.fig{max-width:100%;height:auto;display:block}
svg.fig .ln{stroke:var(--ink);stroke-width:2;fill:none}
svg.fig .thin{stroke:var(--ink);stroke-width:1.5;fill:none}
svg.fig .pt{stroke:var(--c);stroke-width:3;fill:none}
svg.fig .on{fill:var(--c);fill-opacity:.45}
svg.fig .off{fill:var(--surface)}
svg.fig text{fill:var(--ink);font-family:var(--f-body);font-size:16px}
svg.fig .lab{text-anchor:middle;font-size:15px}
svg.fig .ptl{fill:var(--c);font-weight:600;font-size:18px;text-anchor:middle}
svg.geo{background:var(--surface);border-radius:8px}
svg.geo line,svg.geo path,svg.geo polygon,svg.geo circle,svg.geo rect{vector-effect:non-scaling-stroke}
svg.fig .orig{fill:color-mix(in srgb,var(--ink) 9%,transparent);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
svg.fig .img{fill:color-mix(in srgb,var(--c) 20%,transparent);stroke:var(--c);stroke-width:2.4;stroke-linejoin:round}
svg.fig .cons{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:6 5;fill:none}
svg.fig .tick{stroke:var(--muted);stroke-width:1.6}
svg.fig .gridl{stroke:var(--line);stroke-width:1.2}
svg.fig .axe2{stroke:var(--ink);stroke-width:2}
svg.fig .axe3{stroke:var(--c);stroke-width:2;stroke-dasharray:8 5}
svg.fig .gx{stroke:var(--ink);stroke-width:1.8}
svg.fig .glab{font-size:16px;fill:var(--ink);font-family:var(--f-body)}
svg.fig .gimg{fill:var(--c);font-weight:600}
svg.fig .gnum{font-size:15px;font-weight:600;fill:var(--ink);text-anchor:middle}
/* division posée */
.pot{display:inline-grid;grid-template-columns:auto auto;font-variant-numeric:tabular-nums;font-size:1.25rem;line-height:1.5;background:var(--surface);border-radius:8px;padding:10px 16px}
.pleft{padding-right:10px}
.pl .mn{position:relative;border-bottom:2px solid currentColor}
.pl .mn::before{content:"−";position:absolute;left:-1ch}
.pl.rest{font-weight:600;color:var(--c)}
.pright{border-left:2.5px solid var(--ink)}
.pd{border-bottom:2.5px solid var(--ink);padding:0 12px}
.pq{padding:0 12px;font-weight:600;color:var(--c)}

/* exercices */
.sech{font-size:1.5rem;display:flex;gap:10px;align-items:baseline}
.sech span{color:var(--c)}
.exsec{display:grid;gap:16px}
.exsec+.exsec{margin-top:18px}
.ex .t{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px}
.ex h3{font-size:1.15rem}
.ex h3 span{color:var(--c)}
.where{font-size:13px;color:var(--muted);font-weight:500}
details{margin-top:16px;border-top:1.5px dashed var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;color:var(--c);list-style:none;display:inline-flex;gap:8px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid currentColor;font-size:15px;line-height:1}
details[open] summary::before{content:"−"}
.corr{margin-top:12px;background:var(--okbg);border-radius:12px;padding:16px 18px;display:block;min-width:0;line-height:1.75}
.corr[hidden]{display:none}
.corr>*+*{margin-top:10px}
.corr ul{margin:0;padding-left:1.2em}
.corr li+li{margin-top:6px}
.corr .br{display:block;margin:7px 0;border-top:1.5px dashed color-mix(in srgb,var(--ok) 30%,transparent)}
.corr b.lbl{display:inline-block;min-width:2.1em;color:var(--ok)}
.corr .figs{margin:4px 0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px 20px}
.cgrid figure{background:var(--surface);border-radius:10px;padding:10px 12px}
.cgrid figcaption{color:var(--ink);font-size:15px}
.adapt{display:flex;flex-wrap:wrap;gap:10px}
.calcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px;margin:10px 0}
.calcs>span{font-variant-numeric:tabular-nums;white-space:nowrap;padding:4px 0}
.calcs .calc{margin:0}
.dat{font-size:14px;color:var(--c);font-weight:600;margin:4px 0 0;text-align:center}
.pgc{display:inline-block;border:1.5px solid var(--ink);border-radius:8px;padding:8px 16px 8px 12px;margin:6px 10px 6px 0;vertical-align:top;background:var(--surface)}
.pgc b{display:block;font-size:.95em}
.pgc ul{margin:4px 0 0 1.1em;padding:0}
.pgc li{margin:1px 0}
.progs{display:flex;flex-wrap:wrap;gap:4px}
.qlist{display:block;margin:.5em 0 .2em}
.qit{display:block;padding:.3em 0 .3em .1em;border-top:1px dashed var(--line)}
.qit:first-child{border-top:0}
.qlbl{color:var(--c);margin-right:.25em}
.qshort{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0 1.2em}
.qshort .qit{border-top:0}
.adapt button{font:inherit;font-size:15px;font-weight:600;border-radius:999px;padding:9px 16px;cursor:pointer;border:2px dashed var(--line);background:var(--surface);color:var(--ink)}
.adapt button[aria-expanded="true"]{border-style:solid;border-color:var(--c)}
.tag{display:inline-block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:2px 9px;border-radius:999px;margin-bottom:8px}
.tag.aide{background:var(--okbg);color:var(--ok)}
.tag.defi{background:var(--warnbg);color:var(--warn)}

/* quiz */
.qintro{display:grid;gap:14px;justify-items:start}
.qintro h3{font-size:1.3rem}
.qintro p{color:var(--muted)}
.qnot{display:flex;flex-wrap:wrap;gap:8px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:500;align-items:center}
.lv{display:flex;gap:6px;align-items:center}
.lv i{display:block;width:30px;height:8px;border-radius:99px;background:var(--line)}
.lv i.done{background:var(--c);opacity:.45}
.lv i.cur{background:var(--c)}
.lvname{font-weight:600;color:var(--ink)}
.banner{margin:14px 0 0;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:500}
.banner.up{background:var(--okbg);color:var(--ok)}
.banner.down{background:var(--warnbg);color:var(--warn)}
.qtext{font-size:1.2rem;font-weight:500;margin:18px 0 16px}
.fig{margin-bottom:16px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.choice{font:inherit;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s}
.choice:hover:not(:disabled){border-color:var(--c)}
.choice:disabled{cursor:default}
.choice.correct,.ans input.correct{border-color:var(--ok);background:var(--okbg)}
.choice.wrong,.ans input.wrong{border-color:var(--ko);background:var(--kobg)}
.ans{display:flex;gap:10px;flex-wrap:wrap}
.ans input{font:inherit;font-size:1.15rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);flex:1 1 200px;min-width:0;font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--muted);width:100%}
.tplline{font-size:1.3rem;display:flex;align-items:center;flex-wrap:wrap;gap:4px;width:100%}
.blank{font:inherit;font-size:1.05rem;width:3.4em;padding:4px 6px;text-align:center;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.ans input.blank{flex:none;width:3.4em;min-width:0;font-size:1.05rem;padding:4px 6px}
.fr .blank,.ans .fr input.blank{width:3em;margin:2px 0}
.blank.correct{border-color:var(--ok);background:var(--okbg)}
.blank.wrong{border-color:var(--ko);background:var(--kobg)}
.btn{font:inherit;font-weight:600;padding:12px 20px;border-radius:12px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.5;cursor:default}
.fb{margin-top:18px;border-radius:12px;padding:14px 16px;display:grid;gap:12px}
.fb.ok{background:var(--okbg)} .fb.ok strong{color:var(--ok)}
.fb.ko{background:var(--kobg)} .fb.ko strong{color:var(--ko)}
.end{display:grid;gap:14px}
.end .score{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--c)}
.res{display:grid;gap:8px}
.res div{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--paper)}
.res b.ok{color:var(--ok)} .res b.ko{color:var(--ko)}
.acts{display:flex;gap:10px;flex-wrap:wrap}

/* éval d'entraînement */
.evhead{display:grid;gap:8px}
.evhead h3{font-size:1.4rem}
.evhead p{color:var(--muted)}
.amenbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:4px 0}
.amenbar span{color:var(--ink);font-size:.95rem;line-height:1.5;flex:1 1 280px}
.amenbar .btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chrono{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chrono b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
table.comp td:last-child,table.comp th:last-child{text-align:center;width:90px}
table.comp input{width:22px;height:22px;accent-color:var(--ok)}
.band{display:flex;justify-content:space-between;gap:10px;background:var(--paper);border-left:6px solid var(--c);padding:8px 12px;border-radius:6px;font-weight:600;margin-bottom:12px}
.band span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.selfnote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.selfnote input{width:84px;font:inherit;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.total{font-family:var(--f-display);font-size:1.6rem}

/* outils, modes de quiz, progrès, affichage */
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tool{font:inherit;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.tool:hover{border-color:var(--ink)}
.backbtn{display:inline-flex;align-items:center;gap:10px;margin:-14px 0 22px;padding:10px 18px 10px 14px;border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;font-size:16px}
.backbtn span{font-size:1.25em;line-height:1}
.backbtn:hover{opacity:.88}
.tool.dys[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tool.small{border-color:transparent;background:none;font-weight:500;color:var(--muted);text-decoration:underline;padding:5px 6px}
.affpanel{display:grid;gap:12px;margin:-20px 0 28px}
.affpanel h3{font-size:1.15rem}
.affrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%;margin-top:8px}
.qmode{border:2px dashed var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start;justify-items:start}
.qmode h4{font-family:var(--f-display);font-size:1.08rem;margin:0}
.qmode p{font-size:15px;color:var(--muted)}
.chip.done{border-color:var(--ok);color:var(--ok)}
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{display:grid;gap:10px;text-decoration:none}
.pcard .n{font-family:var(--f-display);font-weight:800;color:var(--c);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.pcard h3{font-size:1.1rem}
.pcard p{font-size:14px;color:var(--muted)}
.meter{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.meter .bar{flex:1;margin:0}
.meter .bar i{background:var(--ok)}
.pcard .bar{background:var(--line);height:10px}
html.fs-1 .wrap{zoom:1.12} html.fs-2 .wrap{zoom:1.25}
html.ff-arial{--f-body:Arial,Helvetica,sans-serif;--f-display:Arial,Helvetica,sans-serif}
html.ff-atk{--f-body:"Atkinson Hyperlegible",Arial,sans-serif;--f-display:"Atkinson Hyperlegible",Arial,sans-serif}
html.lh-1 body,html.lh-1 .corr{line-height:2.05}
html.ls-1 body{letter-spacing:.035em;word-spacing:.12em}
/* les blocs (Blockly) et les figures calculent eux-mêmes la place du texte : pas d'espacement ajouté */
html.ls-1 .tabl .tsheet, html.ls-1 .blocklyComputeCanvas, html.ls-1 svg, html.ls-1 .injectionDiv, html.ls-1 .blocklyWidgetDiv, html.ls-1 .blocklyDropDownDiv, html.ls-1 .blocklyTooltipDiv{letter-spacing:normal;word-spacing:normal}
html.nogrid body{background-image:none}

/* schémas du quiz */
.schema{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.hintbox{margin-top:16px;border-top:0;padding-top:0}
.hintbox summary{font-size:15px}
.hintbox .schema{margin-top:10px}
.sch{display:grid;gap:10px;min-width:0}
.schT{font-family:var(--f-display);font-size:1.05rem;color:var(--c)}
.schRow{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.schFig{display:grid;gap:4px;justify-items:start;margin:0;min-width:0}
.schFig figcaption{font-size:14px;color:var(--ink);max-width:46ch}
.schN{font-size:15px}
.steps{margin:0;padding-left:1.4em;display:grid;gap:4px;font-size:15px}
.steps li::marker{font-weight:700;color:var(--c)}
table.num.sm{min-width:400px}
table.num.sm td{font-size:1.1rem;height:38px}
table.num td.hi{background:color-mix(in srgb,var(--c) 22%,transparent);outline:2px solid var(--c);outline-offset:-2px}
.cls3{display:flex;flex-wrap:wrap;gap:8px}
.cls3>div{display:grid;justify-items:center;gap:2px;padding:8px 12px;border-radius:10px;background:var(--paper);border:2px solid var(--line)}
.cd{font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:var(--c);font-variant-numeric:tabular-nums}
.cc{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cw{font-size:14px;font-weight:600}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:1.3rem}
.formula span{display:grid;justify-items:center;line-height:1.1}
.formula b{font-variant-numeric:tabular-nums}
.formula i{font-style:normal;font-size:12px;color:var(--c);font-weight:600}
.calc.prio{white-space:normal;line-height:2}
.calc mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 3px}
.prioOrder{display:flex;flex-wrap:wrap;gap:8px}
.prioOrder div{display:flex;gap:8px;align-items:center;padding:6px 12px;border-radius:10px;background:var(--paper);font-weight:600}
.prioOrder b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:var(--surface)}
.cmp{display:grid;gap:4px}
.digits{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:1.3rem}
.digits span{display:grid;place-items:center;min-width:38px;height:42px;border-radius:8px;background:var(--paper);border:2px solid var(--line);font-weight:700}
.digits span.hi{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.digits i{font-style:normal;color:var(--muted)}
.digits b{color:var(--c)}
.pairs{display:flex;flex-wrap:wrap;gap:6px}
.pairs span{padding:4px 10px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.pairs span.hi{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);font-weight:700}
.crible{display:grid;grid-template-columns:repeat(10,minmax(0,38px));gap:3px}
.crible span{display:grid;place-items:center;height:30px;border-radius:6px;font-size:14px;color:var(--muted);background:var(--paper)}
.crible span.p{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--ink);font-weight:700}
.crible span.hi{outline:2.5px solid var(--ink)}
.frlab{display:flex;gap:12px;align-items:center}
.frlab p{font-size:15px}
.jod{display:grid;gap:4px;padding:10px 14px;border-left:4px solid var(--c);background:var(--paper);border-radius:6px}
svg.fig .fbig{font-size:26px;text-anchor:middle;font-weight:600;fill:var(--ink)}
svg.fig .arrw{fill:none;stroke:var(--c);stroke-width:2}
svg.fig .alab{fill:var(--c);font-weight:700;text-anchor:middle;font-size:16px}
.howto{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;width:100%}
.hstep{display:grid;align-content:end;justify-items:center;gap:0;padding:8px 10px;border-radius:10px;min-width:92px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.hstep b{font-family:var(--f-display);font-size:1.02rem}
.hstep span{font-size:13px;color:var(--muted)}
.hstep.s1{height:58px}.hstep.s2{height:78px}.hstep.s3{height:98px}
.hstep.goal{height:118px;background:var(--okbg);border-color:var(--ok)}
.hstep.goal b{color:var(--ok);font-size:1.4rem}.hstep.goal span{color:var(--ok);font-weight:600}
.harrow{display:grid;justify-items:center;font-size:12px;font-weight:600;color:var(--ok);padding-bottom:14px}
.harrow span{font-size:1.4rem;line-height:1}
.hback{font-size:15px}
.hback span{display:inline-block;background:var(--warnbg);color:var(--warn);font-weight:700;border-radius:999px;padding:1px 10px;margin-right:4px}

/* choix QCM / exercices d'entraînement */
.choose2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.pick{display:grid;gap:12px;align-content:start;justify-items:start;padding:18px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.pickhead{display:flex;align-items:center;gap:10px}
.pickhead .ico{width:38px;height:38px;color:var(--c)}
.pickhead h3{font-size:1.35rem}
.pick .howto .hstep{min-width:70px;padding:6px 8px}
.trhead{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.trpanel{max-width:none}
#quiz:has(.trhead){background:transparent;border:0;padding:0}

/* vide */
.empty{display:grid;gap:10px;justify-items:start;padding:28px 24px;border:2px dashed var(--line);border-radius:16px;background:var(--surface)}
.empty h3{font-size:1.25rem}
.empty p{color:var(--muted)}
footer{margin-top:64px;padding-top:18px;border-top:1.5px solid var(--line);font-size:14px;color:var(--muted)}
.sitefoot a{color:var(--muted)}
.mentions{max-width:760px}
.mentions h2{font-size:1.35rem;margin:30px 0 10px}
.mentions p,.mentions li{line-height:1.65}
.mentions ul{padding-left:22px}
@media print{ .sitefoot{display:none} }

@media (max-width:560px){
  body{font-size:16px}
  .top{flex-wrap:wrap}
  .tools{width:100%;justify-content:flex-start}
  .tools .crumbs{width:100%;justify-content:flex-start}
  .top{margin-bottom:28px}
  .card{padding:18px 16px}
  .cls{padding:18px;gap:14px}
  .cls .big{font-size:3.2rem}
  .tab{padding:10px 9px;font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- Version papier (bouton « Imprimer / PDF ») ---------- */
.printbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:-4px 0 14px}
.printbar[hidden]{display:none}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}
.printbar small{color:var(--muted);font-size:.85rem}
#printzone{display:none}
.ang::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){--paper:#fff;--grid:#fff;--surface:#fff;--ink:#000;--muted:#333;--line:#888;
    --c:#000;--c5:#000;--c6:#000;--c4:#000;--c3:#000;--ok:#000;--okbg:#fff;--ko:#000;--kobg:#fff;--warn:#000;--warnbg:#fff;--hl:transparent;color-scheme:light}
  html,body{background:#fff!important;color:#000}
  html.hasprint body>*:not(#printzone){display:none!important}
  html.hasprint #printzone{display:block}
  @page{size:A4;margin:13mm 14mm}
}
.pdoc{font-family:Arial,Helvetica,sans-serif;font-size:13pt;line-height:1.5;color:#000;background:#fff}
.pdoc *{color:#000;box-shadow:none!important}
.pdoc .ph{border-bottom:1.5px solid #000;padding-bottom:6px;margin-bottom:12px}
.pdoc .ph small{display:block;font-size:10pt;letter-spacing:.04em;text-transform:uppercase}
.pdoc .ph h1{font-family:Arial,Helvetica,sans-serif;font-size:19pt;line-height:1.25;margin:2px 0 0}
.pdoc .ph h2{font-family:Arial,Helvetica,sans-serif;font-size:14pt;margin:2px 0 0;font-weight:700}
.pdoc .pid{display:flex;flex-wrap:wrap;gap:6px 26px;margin:0 0 12px;font-size:12pt}
.pdoc .pblk{border:1px solid #777;border-radius:6px;padding:8px 12px;margin:0 0 10px;background:#fff}
.pdoc .pblk.keep{break-inside:avoid}
.pdoc .pblk h3{font-family:Arial,Helvetica,sans-serif;font-size:13pt;margin:0 0 6px;display:flex;justify-content:space-between;gap:12px;break-after:avoid}
.pdoc h4,.pdoc .psec{break-after:avoid}
.pdoc .psec{font-family:Arial,Helvetica,sans-serif;font-size:14pt;margin:16px 0 8px;break-after:avoid}
.pdoc .pnote{font-style:italic;margin:0 0 8px}
.pdoc .pbreak{break-before:page;page-break-before:always}
.pdoc .body{display:block}
.pdoc .body>*+*{margin-top:8px}
.pdoc svg,.pdoc img,.pdoc table,.pdoc figure,.pdoc .calc,.pdoc .retenir,.pdoc .pgc{break-inside:avoid;max-width:100%}
.pdoc svg,.pdoc img{height:auto}
.pdoc .retenir,.pdoc .calc,.pdoc .calcs>*,.pdoc .pgc,.pdoc .dat{background:#fff!important;border-color:#777!important}
.pdoc table{border-collapse:collapse}
.pdoc th,.pdoc td{border:1px solid #777;padding:4px 8px;background:#fff!important}
.ang.hsvg::before{display:none}
/* ---------- Documents à imprimer (corrections, essentiel, éval) : présentation des fiches de M. Staal ---------- */
.sheet{font-family:Arial,"Liberation Sans",Helvetica,sans-serif;font-size:13pt;line-height:1.5;color:#000;background:#fff;
  --ink:#000;--muted:#333;--line:#888;--paper:#fff;--surface:#fff;--c:#c2185b;--c5:#c2185b;--c6:#1e5aa8;--c4:#0b6b47;--c3:#5b21b6;--ok:#000;--okbg:#fff;--warn:#000;--warnbg:#fff;--hl:transparent;--f-body:Arial,sans-serif;--f-display:Arial,sans-serif}
.sheet *{box-shadow:none!important}
.sheet .sh-title{text-align:center;font-size:16pt;font-weight:700;margin:0 0 4px}
.sheet .sh-sub{text-align:center;font-size:12pt;margin:0 0 14px}
.sheet .sh-id{display:flex;justify-content:space-between;gap:12px;border:1.5px solid #000;padding:6px 12px;margin:0 0 12px;font-size:12pt}
.sheet .sh-sec{font-size:14pt;font-weight:700;margin:18px 0 6px;break-after:avoid}
.sheet .sh-note{font-style:italic;margin:0 0 8px}

.tabl .tpanel h3{font-size:1.05rem;margin:2px 0 8px}
.tabl .tconsigne p{margin:0 0 10px;line-height:1.5}
.tabl .tnote{background:#eef3fd;color:#1b2a44;border-left:4px solid #1a73e8;padding:8px 10px;border-radius:6px;line-height:1.5}
.tabl .tq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.tabl .tqlab{font-weight:700}
.tabl .tqin{width:120px;font:inherit;font-size:17px;padding:7px 10px;border:2px solid var(--line);border-radius:10px}
.tabl .tchoice.sel{outline:3px solid #1a73e8}
.tabl .tmsg{border-radius:12px;padding:12px 14px;margin:10px 0;line-height:1.6}
.tabl .tmsg.ok{background:#e3f4e1} .tabl .tmsg.ko{background:#fdecea}
.tabl .tmsg .btn{margin-top:10px}
.tabl details.lhelp{margin-top:12px}
.tabl .tretenir{margin-top:14px;border:2px solid #5aa65a;border-radius:12px;padding:10px 14px;background:#f3faf2}
.tabl .tretenir ul{margin:6px 0 0;padding-left:20px;line-height:1.55}
.tabl .treset{margin-top:18px}
.tabl .linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:0}
.tabl .tchart{position:absolute;z-index:6;width:380px;background:#fff;border:1px solid #c4c7c5;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:8px 10px 6px;font-family:Arial,Helvetica,sans-serif;cursor:default;-webkit-user-select:none;user-select:none}
.tabl .tchead{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.tabl .tchead b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabl .tctype{display:flex;border:1px solid #c4c7c5;border-radius:16px;overflow:hidden}
.tabl .tctype button{border:0;background:#fff;font:13px Arial,Helvetica,sans-serif;padding:4px 10px;cursor:pointer;color:#1f1f1f}
.tabl .tctype button.on{background:#c2e7ff;font-weight:700}
.tabl .tcx{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:#5f6368;padding:0 4px}
.tabl .tcsvg{width:100%;height:auto;display:block}
.tabl .tcsvg text{font-family:Arial,Helvetica,sans-serif}
.tabl .tcax{font-size:11px;fill:#5f6368} .tabl .tcval{font-size:11px;fill:#1f1f1f;font-weight:700} .tabl .tcleg{font-size:13px;fill:#1f1f1f} .tabl .tcpct{font-size:11px;fill:#fff;font-weight:700}
.tabl .tcerr{font-size:14px;color:#d93025;margin:8px 0}
@media (max-width:1000px){ .tabl .tlay{grid-template-columns:minmax(0,1fr)} .tabl .tpanel{position:static;order:-1} }
@media (max-width:600px){ .tabl .tmenus{display:none} .tabl .tright .tround{display:none} .tabl .tshare{padding:6px 10px} .tabl .ttitle{font-size:15px} .tabl .tscroll{height:440px} }
@media (max-width:760px){ .laby .lgrid{grid-template-columns:minmax(0,1fr)} .laby .lws{height:480px} .laby .lleft{max-width:420px} }
</style>

<script>
/* ================= Outils communs (utilisés par les fichiers de chapitres) ================= */
const CH = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nb = s => String(s).replace(/(\d) (?=\d)/g, "$1 ");
const fr = (a,b) => `<span class="fr"><span>${nb(a)}</span><span>${nb(b)}</span></span>`;
/* fmt : espaces fines dans les nombres et {a/b} -> fraction en colonne, sans toucher aux balises */
const fmt = s => String(s).replace(/(<[^>]*>)|\{([^{}\/<>]+)\/([^{}\/<>]+)\}|(\d) (?=\d)/g,
  (m, tag, a, b, d) => tag ? tag : (a !== undefined ? fr(a, b) : d + " "));
/* images : regroupées par dossier dans ib/<dossier>.js (chargé à la demande) ; sinon le fichier img/ */
window.IMGB = window.IMGB || {};
const IB_LOAD = {};
const ibName = d => d.replace(/^([34]k\d+)(co|ex|cr|ev)$/,"$1");   /* 4e/3e : un seul paquet par chapitre */
const ibLoad = d => (d=ibName(d), IB_LOAD[d] || (IB_LOAD[d] = new Promise(ok => { const s=document.createElement("script"); s.src=`ib/${d}.js`; s.onload=()=>ok(true); s.onerror=()=>ok(false); document.head.appendChild(s); })));
async function fillImgs(root){
  const L=[...(root||document).querySelectorAll("img[data-ib]:not([src])")]; if(!L.length) return;
  await Promise.all([...new Set(L.map(i=>i.dataset.ib.split("/")[0]))].map(ibLoad));
  L.forEach(i=>{ if(!i.getAttribute("src")){ const p=i.dataset.ib; i.src=IMGB[p]||("img/"+p); } });
}
new MutationObserver(()=>fillImgs()).observe(document.documentElement,{childList:true,subtree:true});
const imgSrc = p => IMGB[p] ? `src="${IMGB[p]}"` : `data-ib="${p}"`;
const img = (p, alt, w) => `<img class="figimg" ${imgSrc(p)} alt="${esc(alt)}" style="width:${w}px">`;
const cross = (x,y,cls="pt") => `<path class="${cls}" d="M${x-6} ${y-6} L${x+6} ${y+6} M${x+6} ${y-6} L${x-6} ${y+6}"/>`;
const svgFr = (x,y,a,b) => `<text x="${x}" y="${y}" class="lab">${a}</text><line x1="${x-9}" y1="${y+4}" x2="${x+9}" y2="${y+4}" class="thin"/><text x="${x}" y="${y+20}" class="lab">${b}</text>`;

/* demi-droite graduée : n intervalles, lab = [[rang, texte]], major = rangs à grande graduation, pts = [[lettre, rang]] */
function axis({n, lab=[], major=[], pts=[], w=640}){
  const x0=34, x1=w-50, u=(x1-x0)/n;
  let s=`<svg class="fig" viewBox="0 0 ${w} 104" width="${w}" role="img" aria-label="Demi-droite graduée">`;
  s+=`<line x1="${x0}" y1="52" x2="${w-14}" y2="52" class="ln"/><path d="M${w-22} 45 L${w-10} 52 L${w-22} 59" class="ln"/>`;
  for(let k=0;k<=n;k++){ const x=x0+k*u, big=k===0||major.includes(k); s+=`<line x1="${x}" y1="${big?40:45}" x2="${x}" y2="${big?64:59}" class="ln"/>`; }
  lab.forEach(([k,t])=>{ const x=x0+k*u; const m=String(t).match(/^(\d+)\/(\d+)$/); s+= m ? svgFr(x,80,m[1],m[2]) : `<text x="${x}" y="86" class="lab">${nb(t)}</text>`; });
  pts.forEach(([L,k])=>{ const x=x0+k*u; s+=cross(x,52)+`<text x="${x}" y="30" class="ptl">${L}</text>`; });
  return s+"</svg>";
}
/* demi-droite graduée pour les fractions : unités 0..u, chaque unité partagée en sub */
const fline = (units, sub, pts=[]) => axis({n:units*sub, lab:[...Array(units+1)].map((_,k)=>[k*sub,String(k)]), major:[...Array(units+1)].map((_,k)=>k*sub), pts});
/* disques partagés en n, total parts coloriées (autant de disques que nécessaire) */
function discs(n, total, count){
  count = count || Math.max(1, Math.ceil(total/n)); const r=46, gap=18, W=count*(2*r+gap);
  let s=`<svg class="fig" viewBox="0 0 ${W} ${2*r+8}" width="${W}" role="img" aria-label="Disques partagés en ${n}">`;
  for(let d=0; d<count; d++){
    const cx=r+4+d*(2*r+gap), cy=r+4;
    for(let i=0;i<n;i++){
      const a0=-Math.PI/2+i*2*Math.PI/n, a1=a0+2*Math.PI/n, on=d*n+i<total;
      const p=(a)=>`${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)}`;
      s+= n===1 ? `<circle cx="${cx}" cy="${cy}" r="${r}" class="${on?"on":"off"}"/>` : `<path class="${on?"on":"off"}" d="M${cx} ${cy} L${p(a0)} A${r} ${r} 0 0 1 ${p(a1)} Z"/>`;
    }
    for(let i=0;i<n&&n>1;i++){ const a=-Math.PI/2+i*2*Math.PI/n; s+=`<line x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(a)).toFixed(1)}" y2="${(cy+r*Math.sin(a)).toFixed(1)}" class="thin"/>`; }
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" class="ln"/>`;
  }
  return s+"</svg>";
}
/* rectangles quadrillés : cols x rows, k cases coloriées (ligne par ligne), count rectangles */
function grids(cols, rows, k, count=1, cell=34){
  const w=cols*cell, h=rows*cell, gap=18, W=count*(w+gap);
  let s=`<svg class="fig" viewBox="0 0 ${W} ${h+4}" width="${W}" role="img" aria-label="Rectangle partagé en ${cols*rows} cases">`;
  for(let d=0; d<count; d++){
    const ox=2+d*(w+gap);
    for(let i=0;i<cols*rows;i++){ const x=ox+(i%cols)*cell, y=2+Math.floor(i/cols)*cell; s+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" class="${d*cols*rows+i<k?"on":"off"}"/><rect x="${x}" y="${y}" width="${cell}" height="${cell}" class="thin"/>`; }
    s+=`<rect x="${ox}" y="2" width="${w}" height="${h}" class="ln"/>`;
  }
  return s+"</svg>";
}
/* rectangle partagé en parts de largeurs différentes */
function parts(ws, onIdx){
  const H=70, W=ws.reduce((a,b)=>a+b,0); let x=2, s=`<svg class="fig" viewBox="0 0 ${W+4} ${H+4}" width="${W+4}" role="img" aria-label="Rectangle partagé en parts">`;
  ws.forEach((w,i)=>{ s+=`<rect x="${x}" y="2" width="${w}" height="${H}" class="${onIdx.includes(i)?"on":"off"}"/><rect x="${x}" y="2" width="${w}" height="${H}" class="ln"/>`; x+=w; });
  return s+"</svg>";
}

/* ================= Classes et progression ================= */
const DOM = {N:"Nombres et calculs", G:"Espace et géométrie", M:"Grandeurs et mesures", D:"Données et probabilités", F:"Fonctions", A:"Algorithmique"};

<script>
/* ================= Moteur du site ================= */
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const store = {
  get(k){ try{ return localStorage.getItem("staal-"+k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem("staal-"+k, v); }catch(e){} }
};
let TIMER = null;

const ICO = {
  cours:`<svg class="ico" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 9h13a3 3 0 0 1 3 3v24a3 3 0 0 0-3-3H6z"/><path d="M38 9H25a3 3 0 0 0-3 3v24a3 3 0 0 1 3-3h13z"/></svg>`,
  ex:`<svg class="ico" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M28 6l10 10-20 20H8V26z"/><path d="M24 10l10 10"/></svg>`,
  quiz:`<svg class="ico" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 34l8-10 7 6 13-18"/><path d="M30 12h6v6"/></svg>`,
  eval:`<svg class="ico" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="7" width="26" height="31" rx="3"/><path d="M15 16h14M15 23h14M15 30h8"/></svg>`
};
const app = document.getElementById("app"), crumbs = document.getElementById("crumbs");
/* Noms d'angles : toujours un grand chapeau (« angle ABC », « ABC = 60° », « ABC = DEF = 60° », « ABC + DEF = 180° ») */
const ANG_RE = /\b([Aa]ngles?\s+)([A-Z]{3})\b(?:(\s+et\s+)([A-Z]{3})\b)?|\b([A-Z]{3})\b(?=(?:\s*[=+]\s*[A-Z]{3}\b)*\s*=\s*\d[\d\s,]*\s*°)/g;
const HAT = n => `<span class="ang">${n}</span>`;
function hatify(root){
  if(!root) return; if(root.nodeType===3){ root=root.parentNode; if(!root) return; }
  if(root.nodeType!==1) return; if(root.closest && root.closest(".laby,.tabl,.cpt,.geo,.rap,.mir,.bnav")) return;
  const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>{ const P=n.parentElement; ANG_RE.lastIndex=0;
    return (P && !P.closest("svg,script,style,textarea,.ang") && ANG_RE.test(n.nodeValue)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }});
  const todo=[]; while(tw.nextNode()) todo.push(tw.currentNode);
  todo.forEach(n=>{ const h=esc(n.nodeValue).replace(ANG_RE,(m,a1,n1,a2,n2,n3)=> n3 ? HAT(n3) : a1+HAT(n1)+(n2 ? a2+HAT(n2) : ""));
    const t=document.createElement("template"); t.innerHTML=h; n.replaceWith(t.content); });
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(hatify))).observe(app,{childList:true,subtree:true});

function home(choix){
  crumbs.innerHTML = "";
  const mine = choix ? null : store.get("classe");
  const card = id => { const C=CLASSES[id], dispo=C.chapitres.filter((_,i)=>CH[id+"-"+(i+1)]).length;
    return `<a class="cls" href="#${id}" style="--c:${C.couleur}">
      <span class="big">${id[0]}<sup>e</sup></span>
      <span><strong>${C.nom}</strong><span class="meta">${dispo} chapitre${dispo>1?"s":""} en ligne</span></span>
      <span class="arrow" aria-hidden="true">→</span></a>`; };
  app.innerHTML = `
    <section class="hero">
      <h1>Révise tes <span class="hl">maths</span></h1>
    </section>
    ${mine && CLASSES[mine] ? `<div class="classes">${card(mine)}</div>
    <p class="where" style="margin:-40px 0 48px">Tu n'es pas en ${CLASSES[mine].nom.toLowerCase()} ? <a href="#choix">Changer de classe</a></p>`
    : `<h2 class="ask">Tu es en quelle classe ?</h2>
    <div class="classes">${card("6e")}${card("5e")}${card("4e")}${card("3e")}</div>`}

    ${jeuxAccueil(mine)}
    <section class="uses">
      <h2>Pour chaque chapitre, tu trouves</h2>
      <div class="usegrid">
        <div class="use">${ICO.cours}<h3>Le cours</h3><p>Le cours complet, avec des animations qui montrent les constructions pas à pas, et pour certains chapitres un grand schéma « En un coup d'œil ».</p></div>

</div>
    <div class="chaps">${C.chapitres.map(([t],i)=>{
      const k=id+"-"+(i+1), on=!!CH[k], best=store.get("best-"+k);
      return `<a class="chap ${on?"":"soon"}" href="#${id}-ch${i+1}">
        <div class="row"><span class="n">Chapitre ${i+1}</span>${on?"":`<span class="st off">Bientôt</span>`}</div>

/* ---------- Corrections lisibles : une ligne par réponse, étiquettes en gras ---------- */
function corr(c){
  return fmt(c)
    .replace(/\s*(?:&nbsp;| )?·(?:&nbsp;| )?\s*/g, '<span class="br"></span>')
    .replace(/(^|<span class="br"><\/span>|<p>|<li>|<br>)\s*([a-zA-Z]|\d{1,2})([.)])\s/g, '$1<b class="lbl">$2$3</b> ');
}

/* ---------- Questions lisibles : chaque sous-question (a), b)… 1., 2.… 1 —, 2 —…) sur sa propre ligne ---------- */
const QSTY = [
  {re:/(^|[\s>·])([a-l])\)(?=\s)/g, v:m=>m.charCodeAt(0)-96, f:m=>m+")"},
  {re:/(^|[\s>·])([a-l])\.(?=\s)/g, v:m=>m.charCodeAt(0)-96, f:m=>m+"."},
  {re:/(^|[\s>·])(\d{1,2})\)(?=\s)/g, v:m=>+m, f:m=>m+")"},
  {re:/(^|[\s>·])(\d{1,2})\.(?=\s)/g, v:m=>+m, f:m=>m+"."},
  {re:/(^|[\s>·])(\d{1,2}) —(?=\s)/g, v:m=>+m, f:m=>m+" —"}
];
function qchunk(t){
  for(const st of QSTY){
    const all=[...t.matchAll(st.re)].map(m=>({i:m.index+m[1].length, lab:m[2], len:m[0].length-m[1].length}));
    const seq=[]; let want=1; for(const m of all){ if(st.v(m.lab)===want){ seq.push(m); want++; } }
    if(seq.length<2) continue;
    const pre=t.slice(0,seq[0].i).replace(/[\s·:]*$/, m=>m.includes(":")?" :":"");
    const it=seq.map((m,k)=>t.slice(m.i+m.len, k+1<seq.length?seq[k+1].i:t.length).replace(/[\s·]+$/,"").trim());
    const short = it.length>=4 && it.every(x=>x.replace(/<[^>]*>/g,"").length<=16);
    return pre+`<span class="qlist${short?" qshort":""}">`+seq.map((m,k)=>`<span class="qit"><b class="qlbl">${st.f(m.lab)}</b> ${it[k]}</span>`).join("")+`</span>`;
  }
  /* sous-question déjà seule sur sa ligne : on met seulement l'étiquette en gras */
  return t.replace(/^(\s*)([a-l]\)|\d{1,2}\)|\d{1,2} —|[a-l]\.|\d{1,2}\.)(?=\s)/, '$1<b class="qlbl">$2</b>');
}
function qfmt(html){
  const keep=[];
  let s=String(html).replace(/<(svg|table|figure|select|textarea)[\s\S]*?<\/\1>|<img[^>]*>/g, m=>{ keep.push(m); return "\u0001"+(keep.length-1)+"\u0002"; });
  s=s.split(/(<\/?(?:p|div|li|ul|ol|h\d)\b[^>]*>|<br\s*\/?>|\u0001\d+\u0002)/).map((c,i)=>i%2?c:qchunk(c)).join("");
  return s.replace(/\u0001(\d+)\u0002/g,(_,k)=>keep[+k]);
}

/* ---------- Quiz : questions fixes ou générées, révision espacée ---------- */
const LV = ["", "Niveau 1 · facile", "Niveau 2 · moyen", "Niveau 3 · difficile"];
const DAY = 86400000, BOX = [1,3,7];
const rgen = () => Math.random();
const inst = Q => Q.g ? Q.g() : Q;
const jget = (k, d) => { try{ return JSON.parse(store.get(k)) ?? d; }catch(e){ return d; } };
const REV = {
  all:k => jget("rev-"+k, []),
  save:(k,a) => store.set("rev-"+k, JSON.stringify(a)),
  fail(k,n,l,i){ const a=REV.all(k); const it=a.find(x=>x.n===n&&x.l===l&&x.i===i); if(it){ it.box=1; it.due=Date.now()+DAY; } else a.push({n,l,i,box:1,due:Date.now()+DAY}); REV.save(k,a); },
  ok(k,n,l,i){ const a=REV.all(k); const j=a.findIndex(x=>x.n===n&&x.l===l&&x.i===i); if(j<0) return; const it=a[j]; it.box++; if(it.box>BOX.length) a.splice(j,1); else it.due=Date.now()+BOX[it.box-1]*DAY; REV.save(k,a); },
  due:k => REV.all(k).filter(x=>x.due<=Date.now())
};
const MAST = { get:k=>jget("m-"+k, []), add(k,n){ const a=MAST.get(k); if(!a.includes(n)){ a.push(n); store.set("m-"+k, JSON.stringify(a)); } } };
const qOf = (k,n,l,i) => CH[k] && CH[k].quiz[n] && CH[k].quiz[n].q[l] && CH[k].quiz[n].q[l][i];

/* affiche une question ; after(ok, fb, shown) remplit le retour */
function showQ(el, head, Q){
  return new Promise(resolve=>{
    el.innerHTML = head + `<p class="qtext">${fmt(Q.q)}</p>${Q.fig?`<div class="fig">${fmt(Q.fig)}</div>`:""}<div class="qzone"></div>
      ${Q._N?`<details class="hintbox"><summary>Besoin d'aide ? Voir le rappel en image</summary><div class="schema">${fmt(Q._N)}</div></details>`:""}<div class="fb" hidden></div>`;
    const zone = el.querySelector(".qzone"), fb = el.querySelector(".fb");
    const norm = s => String(s).replace(/[\s  ]/g,"").replace(/\./g,",").replace(/[-–‐‑]/g,"−").replace(/^\+(?=\d)/,"").toLowerCase();
    const kbd = rs => Q.kb||Q.txt ? "text" : rs.some(r=>/,/.test(String(r))) ? "decimal" : "numeric";
    const reps = Q.t ? [(()=>{ let j=0; return Q.t.replace(/□/g, ()=>{ const r=Q.r[j++]; return Array.isArray(r)?r[0]:r; }); })()]
                     : Array.isArray(Q.rep) ? Q.rep : [Q.rep];
    const shown = /^\d+\/\d+$/.test(reps[0]) ? fmt("{"+reps[0]+"}") : fmt(reps[0]);
    const finish = ok => resolve({ok, fb, shown});
    if(Q.t){
      let n=0;
      const line = fmt(Q.t).replace(/□/g, ()=>{ n++; return `<input class="blank" data-i="${n-1}" inputmode="${kbd([].concat(...Q.r))}" autocomplete="off" aria-label="Case ${n}">`; });
      zone.innerHTML = `<form class="ans"><div class="tplline">${line}</div><button class="btn primary">Valider</button><span class="hint">Complète ${n>1?"chaque case":"la case"}, puis valide.</span></form>`;
      const f=zone.querySelector("form"), ins=[...f.querySelectorAll(".blank")];
      f.onsubmit = e => { e.preventDefault(); if(ins.some(x=>!x.value.trim())) return;
        let ok=true;
        ins.forEach((x,i)=>{ const want=[].concat(Q.r[i]); const good=want.some(w=>norm(w)===norm(x.value)); if(!good) ok=false; x.classList.add(good?"correct":"wrong"); x.disabled=true; });
        f.querySelector("button").disabled=true; finish(ok); };
    } else if(Q.c){
      const opts = shuffle([...Q.c]);
      zone.innerHTML = `<div class="choices">${opts.map((c,k)=>`<button class="choice" data-k="${k}">${fmt(c)}</button>`).join("")}</div>`;
      zone.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
        const ok = opts[+b.dataset.k]===reps[0];
        zone.querySelectorAll(".choice").forEach(x=>{ x.disabled=true; if(opts[+x.dataset.k]===reps[0]) x.classList.add("correct"); else if(x===b) x.classList.add("wrong"); });
        finish(ok);
      });
    } else {
      const isFr = reps.some(r=>String(r).includes("/"));
      zone.innerHTML = `<form class="ans"><label for="rep" class="sr">Ta réponse</label><input id="rep" ${isFr||kbd(reps)==="text"?"":`inputmode="${kbd(reps)}"`} autocomplete="off" placeholder="Ta réponse"><button class="btn primary">Valider</button>${isFr?'<span class="hint">Écris une fraction avec la barre « / », par exemple 3/4.</span>':""}</form>`;
      const f=zone.querySelector("form"), inp=f.querySelector("input");
      f.onsubmit = e => { e.preventDefault(); if(!inp.value.trim()) return;
        const ok = reps.some(r=>norm(r)===norm(inp.value));
        inp.disabled=true; f.querySelector("button").disabled=true; inp.classList.add(ok?"correct":"wrong"); finish(ok); };
    }
  });
}
function feedback(fb, ok, msg, shown, Q, extra, label){
  return new Promise(resolve=>{
    fb.hidden=false; fb.className="fb "+(ok?"ok":"ko");
    const hb=fb.parentNode.querySelector(".hintbox"); if(hb) hb.remove();
    const sch = Q.sx || (typeof SX!=="undefined" && SX.auto(Q)) || Q._F || Q._N || "";
    fb.innerHTML = `<p><strong>${msg}</strong> ${ok?"":`La bonne réponse est <b>${shown}</b>. `}${fmt(Q.ex||"")}</p>
      ${sch ? (ok ? `<details class="hintbox"><summary>Voir l'explication en image</summary><div class="schema">${fmt(sch)}</div></details>` : `<div class="schema">${fmt(sch)}</div>`) : ""}${extra||""}
      <div><button class="btn primary" id="next">${label}</button></div>`;
    const nx=document.getElementById("next"); nx.onclick=resolve; nx.focus({preventScroll:true});
  });
}

      <p class="where" style="margin:10px 0 18px">Fais les exercices sur ton cahier. Clique sur « Voir la correction » seulement quand tu as fini.</p>
      <div class="panel trpanel">${secs.map((S,si)=>`<section class="exsec">
        <h2 class="sech"><span>${String.fromCharCode(65+si)}</span>${fmt(S.t)}</h2>

  function pickRandom(keys, n, hard){
    const out=[];
    for(let t=0;t<n;t++){
      const k=keys[t%keys.length], Ns=CH[k].quiz, ni=Math.floor(rgen()*Ns.length);
      const l = hard ? (rgen()<0.5?2:3) : 1+Math.floor(rgen()*3); const pool=Ns[ni].q[l];
      out.push({k, n:ni, l, i:Math.floor(rgen()*pool.length)});
    }

  }

  /* liste de questions à la suite (test rapide, révision, mixte) */
  async function runList(items, title){
    let score=0; const wrong=[];
    for(let t=0;t<items.length;t++){
      const it=items[t], base=qOf(it.k,it.n,it.l,it.i); if(!base) continue;

      const {ok, fb, shown} = await showQ(el, head, Q);
      if(ok){ score++; REV.ok(it.k,it.n,it.l,it.i); } else { REV.fail(it.k,it.n,it.l,it.i); wrong.push(N.nom); }
      await feedback(fb, ok, ok?"Juste !":"Pas tout à fait.", shown, Q, ok?"":`<p class="where">Cette question reviendra dans « Mes questions à revoir ».</p>`, t+1<items.length?"Question suivante":"Voir mon bilan");
    }
    el.innerHTML = `<div class="end"><span class="eyebrow">${title}</span><span class="score">${score} / ${items.length}</span>
      <p>${score===items.length?"Parfait !":wrong.length?"Les questions ratées reviendront dans « Mes questions à revoir » : c'est en les retravaillant plus tard qu'on les retient.":""}</p>
      ${wrong.length?`<div class="res">${[...new Set(wrong)].map(n=>`<div><span>${fmt(n)}</span><b class="ko">À retravailler</b></div>`).join("")}</div>`:""}

    document.getElementById("back").onclick = intro;
  }

  /* parcours progressif par niveaux */
  async function adaptive(order){

    for(let ni=0; ni<order.length; ni++){
      const n=order[ni], N=notions[n]; let lvl=1, errs=0, banner="", last=null; const used={1:[],2:[],3:[]};
      while(true){
        const pool=N.q[lvl];
        let avail=pool.map((_,i)=>i).filter(i=>!used[lvl].includes(i));
        if(!avail.length){ used[lvl]=[]; avail=pool.map((_,i)=>i).filter(i=>i!==last||pool.length===1); }
        const i=avail[Math.floor(rgen()*avail.length)]; used[lvl].push(i); last=i;
        const Q=inst(pool[i]); Q._N=N.schema; Q._F=N.schemaFb;
        const head=`<div class="qhead"><span>${order.length>1?`Notion ${ni+1} sur ${order.length} · `:""}<span class="lvname">${fmt(N.nom)}</span></span>
          <span class="lv" aria-label="${LV[lvl]}">${[1,2,3].map(k=>`<i class="${k<lvl?"done":k===lvl?"cur":""}"></i>`).join("")}<span>${LV[lvl]}</span></span></div>
          ${banner?`<p class="banner ${banner[0]}">${banner[1]}</p>`:""}`;
        const {ok, fb, shown} = await showQ(el, head, Q);
        let msg = ok?"Juste !":"Pas tout à fait.", label="Question suivante", done=false, extra="";
        if(ok){ REV.ok(key,n,lvl,i);
          if(lvl===3){ res.push({n,ok:true}); MAST.add(key,n); msg="Bravo, notion maîtrisée !"; done=true; }
          else { lvl++; banner=["up",`Bravo ! Tu passes au ${LV[lvl].toLowerCase()}.`]; }
        } else { REV.fail(key,n,lvl,i); errs++;
          if(errs>=4){ res.push({n,ok:false}); done=true; extra=`<p>Cette notion est à revoir : relis le cours, puis réessaie plus tard.</p>`; }
          else { const was=lvl; lvl=Math.max(1,lvl-1); banner=["down", was===1?"Encore une question de ce niveau, tu vas y arriver.":"On reprend avec une question plus simple, puis tu remontes."]; }
        }
        if(done) label = ni+1<order.length?"Notion suivante":"Voir mon bilan";
        await feedback(fb, ok, msg, shown, Q, extra, label);
        if(done) break;
      }
    }
    const m=res.filter(r=>r.ok).length;
    if(order.length===notions.length){ const prev=parseInt((store.get("best-"+key)||"0").split("/")[0],10); if(m>=prev) store.set("best-"+key, `${m}/${notions.length}`); }
    el.innerHTML = `<div class="end"><span class="eyebrow">Ton bilan</span><span class="score">${m} / ${order.length}</span>
      <p>${m===order.length?"Toutes les notions sont maîtrisées. Bravo !":"Notion maîtrisée = trois niveaux réussis. Pour les autres, relis le cours puis recommence. Tes erreurs t'attendent dans « Mes questions à revoir »."}</p>
      <div class="res">${res.map(r=>`<div><span>${fmt(notions[r.n].nom)}</span>${r.ok?'<b class="ok">Maîtrisée</b>':'<b class="ko">À revoir</b>'}</div>`).join("")}</div>
      <div class="acts"><button class="btn primary" id="again">Retour</button>${m<order.length?'<button class="btn" id="tocours">Revoir le cours</button>':""}</div></div>`;
    document.getElementById("again").onclick = intro;
    const tc=document.getElementById("tocours"); if(tc) tc.onclick=toCours;
  }
  intro();
}

/* ---------- Éval d'entraînement ---------- */
/* ---------- Évaluation aménagée (tiers-temps) : environ les 3/4 du sujet, au moins un exercice par compétence ---------- */
/* colonne « Exercices » d'une compétence : « Ex. 1 (question 2), 3 et 4 (7 points) » → numéros 1, 3, 4 */
const compSplit = t => { const m=/^(.*?)\s*(\(\s*[\d,.]+\s*points?\s*\))?\s*$/.exec(String(t)); return [m[1], m[2]||""]; };
const compBare = t => compSplit(t)[0].replace(/\([^)]*\)/g," ");
function compExos(c, n){ const out=new Set(); compBare(c[2]).replace(/(\d+)\s*(?:à|-|–)\s*(\d+)/g,(m,a,b)=>{ for(let k=+a;k<=+b;k++) out.add(k-1); return " "; }).replace(/\d+/g,m=>{ out.add(+m-1); return ""; }); return [...out].filter(k=>k>=0&&k<n); }
function amenage(E){
  const n=E.exos.length, T=E.exos.reduce((a,x)=>a+x.p,0), C=E.comp.map(c=>compExos(c,n)), parsed=C.every(l=>l.length);
  let best=null;
  for(const [lo,hi,useC] of [[0.65,0.8,true],[0.6,0.85,true],[0.6,0.85,false]]){
    for(let m=1;m<(1<<n)-1;m++){
      const kept=E.exos.map((e,i)=>!((m>>i)&1)), K=E.exos.reduce((a,e,i)=>a+(kept[i]?e.p:0),0);
      if(K<lo*T-1e-9 || K>hi*T+1e-9) continue;
      if(useC && parsed && C.some(l=>!l.some(i=>kept[i]))) continue;
      let sc=Math.abs(K-0.75*T); E.exos.forEach((e,i)=>{ if(!kept[i]) sc+=0.3+0.04*(n-1-i); });
      if(!best || sc<best.sc) best={sc, kept, K};
    }
    if(best) break;
  }
  if(!best) return null;
  const map=[]; let j=0; best.kept.forEach((k,i)=>{ map[i]=k?++j:0; });
  const liste=a=>a.length===1?String(a[0]):`${a.slice(0,-1).join(", ")} et ${a[a.length-1]}`;
  /* tous les exercices de la compétence sont gardés : même texte, numéros mis à jour ; sinon on réécrit la liste */
  const renum = t => { const [pre,pts]=compSplit(t); return pre.split(/(\([^)]*\))/).map((x,k)=>k%2?x:x.replace(/\d+/g,d=>map[+d-1]||d)).join("")+(pts?" "+pts:""); };
  const comp = parsed ? E.comp.map((c,ci)=>{ const l=C[ci].filter(i=>best.kept[i]); if(!l.length) return [c[0],c[1],"non évalué dans cette version"];
      if(l.length===C[ci].length) return [c[0],c[1],renum(c[2])];

/* PDF fabriqué dans la page (la page du site ne peut pas ouvrir la fenêtre d'impression elle-même) */
const loadScript = src => new Promise((ok,ko)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=ok; sc.onerror=()=>ko(new Error(src)); document.head.appendChild(sc); });

/* Le document est photographié bloc par bloc (un exercice, un encadré…) puis rangé sur des pages A4 :

function pdfBlocks(box){ const out=[]; const walk=el=>[...el.children].forEach(c=>{ if(c.classList.contains("pbreak")){ out.push("break"); walk(c); } else out.push(c); }); walk(box); return out; }
function whiteRow(canvas, want, minRow){
  const ctx=canvas.getContext("2d"), w=canvas.width, x0=Math.round(w*0.03), x1=Math.round(w*0.97);
  const top=Math.max(minRow, want-Math.round(canvas.height*0.25)); if(want<=top) return want;
  const data=ctx.getImageData(x0, top, x1-x0, want-top).data, rw=(x1-x0)*4;
  for(let r=want-top-1; r>=0; r--){ let ok=true; for(let i=r*rw; i<(r+1)*rw; i+=4){ if(data[i]<235||data[i+1]<235||data[i+2]<235){ ok=false; break; } } if(ok) return top+r; }

async function buildPdf(box, prog){

const SVG_PROPS=["fill","fill-opacity","stroke","stroke-width","stroke-opacity","stroke-dasharray","stroke-linecap","stroke-linejoin","opacity","font-size","font-family","font-weight","font-style","text-anchor","dominant-baseline","paint-order","visibility"];
function pdfReady(box){
  /* chapeaux des angles en SVG (le PDF ne sait pas dessiner le chapeau du site) */
  box.querySelectorAll(".ang").forEach(a=>{ a.classList.add("hsvg");
    a.insertAdjacentHTML("afterbegin",`<svg viewBox="0 0 100 10" preserveAspectRatio="none" style="position:absolute;left:0;top:0;width:100%;height:.34em;overflow:visible" aria-hidden="true"><polyline points="1,9.2 50,0.9 99,9.2" fill="none" stroke="#000" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`); });

  box.querySelectorAll("svg").forEach(svg=>{ svg.querySelectorAll("*").forEach(el=>{ const cs=getComputedStyle(el); let st="";
      SVG_PROPS.forEach(k=>{ const v=cs.getPropertyValue(k); if(v) st+=`${k}:${v};`; }); el.setAttribute("style",(el.getAttribute("style")||"")+";"+st); });
    const r=svg.getBoundingClientRect(); if(r.width){ svg.setAttribute("width",r.width.toFixed(1)); svg.setAttribute("height",r.height.toFixed(1)); } });

    await Promise.all([...box.querySelectorAll("img")].filter(i=>!i.complete).map(i=>new Promise(ok=>{ i.onload=i.onerror=ok; })));
    pdfReady(box); const blob=await buildPdf(box, (i,n)=>say(`Préparation du PDF… ${Math.round(i/n*100)} %`));
    window.__lastPdf=blob;
    if(dl){ try{ await dl.save({filename, data:blob}); say("C'est prêt : ouvre le PDF pour l'imprimer."); } catch(e){ say(e && e.code==="declined" ? "Téléchargement annulé." : "Le téléchargement n'est pas possible ici."); } }
    else{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.target="_blank"; document.body.appendChild(a); a.click(); a.remove(); say("C'est prêt : ouvre le PDF pour l'imprimer."); }
  }catch(e){ console.error("PDF", e); say("Le PDF n'a pas pu être préparé. Réessaie dans un instant."); }
  finally{ if(box) box.remove(); btn.disabled=false; btn.textContent=label; }
}

/* ---------- Documents à imprimer, présentés comme les fiches de M. Staal ---------- */
const SHEET_KINDS = {cours:"Le cours", ess:"En un coup d'œil", ex:"Exercices", corr:"Corrections des exercices", evs:"Évaluation d'entraînement", evc:"Évaluation d'entraînement — corrigé et barème"};
function sheetHTML(P, kind){
  /* même modèle que les fiches Word de M. Staal : « Chapitre N — Titre », parties « I — … » en bleu, encadrés colorés */
  const D=P.D, num=pnum, R=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
  const SUF={cours:"", ess:" — En un coup d'œil", ex:" — Exercices", corr:" — Corrigé"};
  const title = k => `<h1 class="sh-title">Chapitre ${P.n} — ${esc(P.titre)}${P.only&&k==="cours"?" (suite)":SUF[k]||""}</h1>`;
  const exH = e => `<div class="sh-h"><span>${e.n?fmt(e.n)+" : ":""}${fmt(e.t)}</span></div>`;
  const sav = () => D.savoir?`<div class="sh-sav keep"><p><b>Ce que je dois savoir faire à la fin du chapitre :</b></p><ul>${D.savoir.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul></div>`:"";
  const sec = (k,t) => `<div class="sh-sec">${k} — ${fmt(t)}</div>`;
  if(kind==="cours") return title("cours") + (P.only?"":sav())
    + D.cours.map((c,i)=>P.only&&!P.only.includes(i+1)?"":`<div class="sh-part">${sec(c.k||R[i],c.t)}<div class="body">${fmt(c.h)}</div></div>`).join("");
  if(kind==="ess" && window.parCoeurSheet) return parCoeurSheet(P);
  if(kind==="ess"){ const tmp=document.createElement("div");
    return title("ess") + sav()
      + D.cours.map((c,i)=>{ tmp.innerHTML=fmt(c.h); const b=[...tmp.querySelectorAll(".retenir")].map(x=>x.outerHTML).join(""); return b?`<div class="sh-part">${sec(c.k||R[i],c.t)}<div class="body">${b}</div></div>`:""; }).join(""); }
  if(kind==="ex") return title("ex") + D.exos.map((S,si)=>sec(R[si],S.t)+(S.note?`<p class="sh-note">${fmt(S.note)}</p>`:"")
      + S.e.map(e=>`<div class="sh-ex keep">${exH(e)}<div class="body">${qfmt(fmt(e.h))}</div></div>`).join("")).join("");
  if(kind==="corr") return title("corr") + D.exos.map((S,si)=>{ const L=S.e.filter(e=>e.c); return L.length?sec(R[si],S.t)
      + L.map(e=>`<div class="sh-ex keep">${exH(e)}<div class="body">${corr(e.c)}</div></div>`).join(""):""; }).join("");
  let E=D.eval; if(!E) return "";
  if(kind==="evsa"||kind==="evca"){ E=amenOf(E)||E; kind=kind==="evsa"?"evs":"evc"; }
  const T=num(E.exos.reduce((a,x)=>a+x.p,0));
  if(kind==="evs") return `<div class="sh-id"><span>Nom : ………………………</span><span>Prénom : ………………………</span><span>Classe : ……</span><span style="white-space:nowrap"><b>Note : …… / ${T}</b></span></div>`
      + `<h1 class="sh-title">${esc(E.titre)}</h1><p class="sh-sub">${E.info}</p>`
      + `<table class="sh-comp"><thead><tr><th>Compétence</th><th>Ce que je dois être capable de faire</th><th>Exercices</th><th>Niveau</th></tr></thead><tbody>${E.comp.map(c=>`<tr><td><b>${c[0]}</b></td><td>${fmt(c[1])}</td><td>${c[2]}</td><td style="width:60px"></td></tr>`).join("")}</tbody></table>`
      + E.exos.map((e,i)=>`<div class="sh-ex keep"><div class="sh-h"><span>Exercice ${i+1} : ${fmt(e.t)}</span><span class="pts">…… / ${num(e.p)}</span></div><div class="body">${qfmt(fmt(e.h))}</div></div>`).join("");
  if(kind==="evc") return `<h1 class="sh-title">${esc(E.titre)} — Corrigé et barème</h1>`
      + E.exos.map((e,i)=>`<div class="sh-ex keep"><div class="sh-h"><span>Exercice ${i+1} : ${fmt(e.t)}</span><span class="pts">/ ${num(e.p)}</span></div><div class="body">${corr(e.c)}</div></div>`).join("")
      + `<p class="sh-bar">Total : …… / ${T}</p>`;
  return "";
}
/* page utilisée pour fabriquer les PDF : #sheet:5e-4:corr */
function sheetPage(key, kind, only){
  const [id,n]=key.split("-"), C=CLASSES[id], D=CH[key];
  let z=document.getElementById("sheetpage"); if(!z){ z=document.createElement("div"); z.id="sheetpage"; document.body.appendChild(z); }
  document.documentElement.classList.add("sheetmode");
  z.className="sheet"; z.innerHTML=D?sheetHTML({D, nom:C.nom, n:+n, titre:C.chapitres[+n-1][0], only:only?only.split(",").map(Number):null}, kind).replace(/ loading="lazy"/g,""):"";
  hatify(z); const T=C.chapitres[+n-1][0], E=D&&D.eval, SUF={cours:"", ess:" — En un coup d'œil", ex:" — Exercices", corr:" — Corrigé"};
  const EA = E && /a$/.test(kind) ? (amenOf(E)||E) : E;
  document.title = /^ev/.test(kind) && E ? `${EA.titre}${/^evc/.test(kind)?" — Corrigé":""} — ${id}` : `Chapitre ${n} — ${T}${SUF[kind]||""} — ${id}`;
}
/* ---------- Navigation ---------- */
/* feuilles de construction de M. Staal : rangées à part, à la fin de l'onglet Exercices (pas dans la liste ni dans les PDF d'exercices) */
const isFeuille = (S,e) => /^Feuille de constructions/i.test(S.t||"") || /^Feuille ·/.test(e.n||"") || /feuille de constructions/i.test(e.w||"");
function splitFeuilles(){ Object.values(typeof CH!=="undefined"?CH:{}).forEach(D=>{ if(!D || D._fx || !D.exos) return; D._fx=1; const F=[];
  D.exos=D.exos.map(S=>{ const keep=S.e.filter(e=>!isFeuille(S,e)); S.e.filter(e=>isFeuille(S,e)).forEach(e=>F.push(e)); return Object.assign({},S,{e:keep}); }).filter(S=>S.e.length);
  const no=e=>{ const m=/^Feuille · Exercice (\d+)/.exec(e.n||""); return m?+m[1]:null; };
  if(F.length && F.every(e=>no(e)!==null)) F.sort((a,b)=>no(a)-no(b));
  if(F.length) D.feuille=F; }); }
function route(){ splitFeuilles();
  if(TIMER){ clearInterval(TIMER); TIMER=null; }
  PRINT.cur=null; document.documentElement.classList.remove("hasprint");
  const sm = location.hash.match(/^#sheet:((?:6e|5e|4e|3e)-\d+):(\w+)(?::([\d,]+))?$/); if(sm){ sheetPage(sm[1], sm[2], sm[3]); return; }
  document.documentElement.classList.remove("sheetmode");
  const h = location.hash.slice(1), m = h.match(/^(6e|5e|4e|3e)(?:-ch(\d+))?$/);
  document.documentElement.style.removeProperty("--c");
  document.querySelectorAll(".sfin").forEach(x=>x.remove());
  const hb=h.split("/")[0], JS=JEUX[hb] && JEUX[hb].seances ? JEUX[hb] : null, sid=JS && seanceDe(JS, h.split("/")[1]) ? h.split("/")[1] : null;
  if(window.LABY) LABY.destroy(); if(window.SCRATCH) SCRATCH.destroy(); if(window.TABLEUR) TABLEUR.destroy(); if(window.COMPTE) COMPTE.destroy(); if(window.GEOJEU) GEOJEU.destroy(); if(window.RAPPORTEUR) RAPPORTEUR.destroy(); if(window.MIROIR) MIROIR.destroy(); if(window.BNAV) BNAV.destroy();
  document.documentElement.classList.toggle("wide", JS ? !!(sid && (JS.tab || JS.wide)) : !!(JEUX[h] && (JEUX[h].tab || JEUX[h].wide)));
  if(window.PAGES && PAGES[h]) PAGES[h].show(); else if(h==="mentions") mentions(); else if(JS) (sid ? seancePage(hb, sid) : outil(hb)); else if(JEUX[h]) labyrinthe(h); else if(h==="choix") home(true); else if(!m) home(); else if(!m[2]) classe(m[1]); else chapitre(m[1], +m[2]);
  /* bouton de retour bien visible en haut de chaque page (sauf l'accueil) */
  let back=null;
  if(m && !m[2]) back=["#accueil","Retour à l'accueil"];
  else if(m && m[2]) back=["#"+m[1],"Retour aux chapitres"];
  else if(JS) back = sid ? ["#"+hb,"Retour aux séances"] : ["#"+JS.cls,"Retour aux chapitres"];
  else if(JEUX[h]) back=["#"+JEUX[h].cls,"Retour aux chapitres"];
  else if(h==="mentions") back=["#accueil","Retour à l'accueil"];
  else if(window.PAGES && PAGES[h]) back=PAGES[h].back;
  if(back) app.insertAdjacentHTML("afterbegin", `<a class="backbtn" href="${back[0]}"><span aria-hidden="true">←</span> ${back[1]}</a>`);
  window.scrollTo(0,0);
}
